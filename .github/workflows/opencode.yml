name: opencode

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Branch, commits, pull request and comments are all written with the OpenCode
# GitHub App token obtained through OIDC, so GITHUB_TOKEN itself stays read-only.
permissions:
  id-token: write
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  # Adding the `ai-ready` label implements the issue. A label event carries no
  # comment to read instructions from, so this job supplies its own prompt.
  label:
    name: Implement labelled issue
    if: github.event_name == 'issues' && github.event.label.name == 'ai-ready'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run opencode
        uses: anomalyco/opencode/github@v1.18.30
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          model: openrouter/deepseek/deepseek-v4.1-flash
          variant: max
          prompt: |
            Work only on the issue in this thread. Follow AGENTS.md, including its
            "Definition of done" section: `npm run lint`, `npm run test` and
            `npm run build` must all pass before you finish, tests must cover the
            new logic, and README.md must be updated when user-visible behaviour
            changes. Keep the change small and scoped to this issue. Open a pull
            request that closes the issue with "Closes #<number>". If the work
            needs a new dependency or a decision you cannot make, stop and say so
            instead of guessing.

  # `/oc` or `/opencode` in an issue comment, or on a line in a pull request
  # review comment, runs that instruction directly.
  comment:
    name: Run comment instruction
    if: |
      (github.event_name == 'issue_comment' ||
       github.event_name == 'pull_request_review_comment') &&
      (startsWith(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, ' /oc') ||
       startsWith(github.event.comment.body, '/opencode') ||
       contains(github.event.comment.body, ' /opencode'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run opencode
        uses: anomalyco/opencode/github@v1.18.30
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          model: openrouter/deepseek/deepseek-v4.1-flash
          variant: max