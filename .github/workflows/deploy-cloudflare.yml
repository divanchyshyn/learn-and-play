name: Deploy Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

# The deploy needs no repository write access: it builds `dist/` and hands it to
# Cloudflare with an API token held in repository secrets.
permissions:
  contents: read

concurrency:
  group: cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Run tests
        run: npm run test
      - name: Build
        run: npm run build
      # wrangler-action installs its own Wrangler, so this adds no dependency to
      # package.json. The Worker name comes from wrangler.jsonc.
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
