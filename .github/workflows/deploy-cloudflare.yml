name: Deploy Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

# The deploy needs no repository write access: it builds `dist/`, builds and
# pushes the container image, and hands both to Cloudflare with an API token held
# in repository secrets.
permissions:
  contents: read

concurrency:
  group: cloudflare
  cancel-in-progress: true

jobs:
  # Lint, tests and builds always run, so a human never has to approve a broken
  # change. The built `dist/` is uploaded as an artifact so the deploy publishes
  # exactly the bytes that were verified, not a second, separate build.
  verify:
    runs-on: ubuntu-latest
    # The Rust tests create a throwaway database per test (`#[sqlx::test]`).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: learn_and_play
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/learn_and_play
    steps:
      - uses: actions/checkout@v7

      # Rust first, so the cheapest-to-run failure is also the first one.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api
      - name: Rust format
        run: cargo fmt --manifest-path api/Cargo.toml --all --check
      - name: Rust lint
        run: cargo clippy --manifest-path api/Cargo.toml --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --manifest-path api/Cargo.toml

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Run tests
        run: npm run test
      - name: Build
        run: npm run build
      - name: Store the verified build
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # The deploy is the only step that can touch the live site, so it waits for a
  # human: the `cloudflare-production` environment carries a required reviewer
  # rule, and the job stays pending until someone approves it in the workflow
  # run. That gate is unchanged from the days when this Worker served nothing but
  # static files — a database and a container do not make it less necessary.
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-production
      url: https://play2learn.divanchyshyn.com/
    steps:
      # wrangler.jsonc comes from the repository; dist/ comes from the verify job.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Fetch the verified build
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api

      # Applied before the deploy, and after approval: a migration that fails
      # stops this job instead of shipping code that expects a schema which is not
      # there. Migrations are additive by rule (see the runbook), so a rollback of
      # the Worker still finds a database it understands.
      - name: Apply the database migrations
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::PRODUCTION_DATABASE_URL is not set: refusing to deploy without a schema"
            exit 1
          fi
          cargo run --manifest-path api/Cargo.toml --locked -- migrate

      # `wrangler deploy` builds the container image from api/Dockerfile and
      # pushes it, then publishes the Worker and the assets in one version — so
      # the rollback of either is the rollback of both.
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
