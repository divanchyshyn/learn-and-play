name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run game tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Run tests
        run: npm run test
      - name: Build
        run: npm run build

  # The Rust service is checked the way the project checks the frontend: format,
  # lint, tests. The image build is here too, because the Dockerfile is the one
  # file `cargo test` cannot check and it is what actually ships.
  rust:
    name: Check the Rust service
    runs-on: ubuntu-latest
    # `#[sqlx::test]` creates a throwaway database per test, so the suite needs a
    # real Postgres: the same image the local docker-compose.yml runs.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: learn_and_play
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/learn_and_play
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api
      - name: Rust format
        run: cargo fmt --manifest-path api/Cargo.toml --all --check
      - name: Rust lint
        run: cargo clippy --manifest-path api/Cargo.toml --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --manifest-path api/Cargo.toml
      - uses: docker/setup-buildx-action@v4
      - name: Build the container image
        uses: docker/build-push-action@v7
        with:
          context: api
          push: false
          cache-from: type=gha,scope=api-image
          cache-to: type=gha,mode=max,scope=api-image
