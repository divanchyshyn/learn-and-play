# Keeps dependencies and workflow actions current. These pull requests are the
# safest way to practise the review loop before letting the coding agent loose.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # ESLint 10 is blocked upstream: eslint-plugin-react@7.37.5, its latest
    # release, still declares a peer range ending at ^9.7, so `npm ci` dies with
    # ERESOLVE. Both packages are version-locked, so hold them together. Delete
    # this block once eslint-plugin-react ships ESLint 10 support.
    ignore:
      - dependency-name: 'eslint'
        versions: ['>=10']
      - dependency-name: '@eslint/js'
        versions: ['>=10']
    groups:
      # Minor and patch updates arrive together so they stay easy to review and
      # merge. Major updates are kept in their own groups so they never ride
      # along with safe bumps: a breaking major should be reviewable on its own.
      dev-dependencies:
        dependency-type: development
        update-types: ['minor', 'patch']
      dev-dependencies-major:
        dependency-type: development
        update-types: ['major']
      production-dependencies:
        dependency-type: production
        update-types: ['minor', 'patch']
      production-dependencies-major:
        dependency-type: production
        update-types: ['major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ['*']
